# Plomvix runtime configuration

[server]
host = "127.0.0.1"
port = 5432
max_connections = 100
ssl_enabled = false
# ssl_cert_path = ""
# ssl_key_path = ""
auth_type = "trust"

[logger]
level = "info"
format = "text"
output = "stdout"

[sql_engine]
data_dir = "data/sql"
max_mutation_rows = 1000
vacuum_workers = 2
vacuum_queue_size = 100

[storage]
db_path = "data/plomvix.db"
wal_path = "data/plomvix.wal"
cache_size_mb = 64
sync_writes = true
max_open_files = 256
